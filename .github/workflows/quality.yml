name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.6'
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Run backend tests with disposable PostgreSQL
        working-directory: backend
        env:
          RUN_POSTGRES_TESTS: '1'
        run: uv run --locked pytest -q --disable-warnings --junitxml=test-results/backend.xml
      - name: Reject missing or skipped backend checks
        run: python3 scripts/check_test_results.py backend/test-results/backend.xml
      - name: Save backend results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-results
          path: backend/test-results/
          retention-days: 7

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run interface tests
        working-directory: frontend
        run: npm test -- --allowOnly=false --reporter=default --reporter=junit --outputFile.junit=test-results/frontend.xml
      - name: Reject missing or skipped frontend checks
        run: python3 scripts/check_test_results.py frontend/test-results/frontend.xml
      - name: Compile production application and browser tests
        working-directory: frontend
        run: npm run build
      - name: Save frontend results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-results
          path: frontend/test-results/
          retention-days: 7

  browser:
    name: Critical browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.6'
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium and system libraries
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Run the full browser suite against an isolated stack
        working-directory: frontend
        run: npm run test:e2e
      - name: Save browser report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-results
          path: frontend/e2e-artifacts/
          retention-days: 7

  delivery-gate:
    name: Delivery gate
    if: always()
    needs: [backend, frontend, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          python3 - <<'PY'
          import os
          results = {name: os.environ[name] for name in (
              "BACKEND_RESULT", "FRONTEND_RESULT", "BROWSER_RESULT"
          )}
          print(results)
          if any(result != "success" for result in results.values()):
              raise SystemExit("Delivery rejected: all checks must succeed.")
          PY
