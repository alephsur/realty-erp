[project]
name = "realty-erp-backend"
version = "0.1.0"
description = "Real Estate ERP Backend"
requires-python = ">=3.10"
dependencies = [
    "alembic==1.13.1",
    "fastapi[all]>=0.110.0",
    "passlib[bcrypt]==1.7.4",
    "psycopg2-binary==2.9.9",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.3.0",
    "sqlalchemy==2.0.28",
    "bcrypt==4.0.1",
    "python-dateutil>=2.9.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pytest",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
